<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenieMade — Affiliate Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--night:#130a26;--night2:#1c1140;--panel:#231553;--panel2:#2b1b63;--line:#3a2a6b;--ink:#f7f1ff;--mut:#c6b6ea;--faint:#8f7fbb;--gold:#f5c451;--gold2:#ffe390;--goldd:#c88f2c;--ok:#57e0a8;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
body{background:linear-gradient(178deg,var(--night2),var(--night));color:var(--ink);font:15px/1.6 var(--sans);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.wm{font-family:var(--serif);font-size:1.25rem}.wm b{color:var(--gold)}
.tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--goldd);border-radius:20px;padding:4px 11px}
.btn{border:none;border-radius:22px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a05}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink)}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,22,.85);backdrop-filter:blur(6px);z-index:50}
.gatebox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(92vw,380px);text-align:center}
.gatebox h2{font-family:var(--serif);margin-bottom:6px}.gatebox p{color:var(--mut);font-size:.88rem;margin-bottom:16px}
.gatebox input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--night);color:var(--ink);font:inherit;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--panel)}
.card .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.card .v{font-family:var(--serif);font-size:2rem;margin-top:4px;color:var(--gold2)}
h2.sec{font-family:var(--serif);margin:22px 0 10px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--faint);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
tr:hover td{background:rgba(255,255,255,.02)}
.state{font-size:.72rem;font-weight:700;border-radius:20px;padding:2px 9px}
.state.active{background:#0f2f1c;color:var(--ok)} .state.other{background:rgba(255,255,255,.06);color:var(--mut)}
.muted{color:var(--faint);font-size:.86rem}.err{color:#ff9f6f}
a.lnk{color:var(--gold2)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 0}
</style></head>
<body>
<header>
  <span class="wm">Genie<b>Made</b> · Affiliate Admin</span>
  <div class="tools"><span class="tag" id="statusTag">Rewardful</span>
    <a class="btn ghost" href="https://app.getrewardful.com/affiliates" target="_blank" rel="noopener">Open Rewardful ↗</a>
    <button class="btn ghost" id="refreshBtn">Refresh</button>
    <button class="btn ghost" id="logoutBtn">Lock</button></div>
</header>

<div class="gate" id="gate">
  <div class="gatebox">
    <h2>Admin access</h2>
    <p>Enter the affiliate-admin password.</p>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password">
    <div class="err" id="gateErr" style="min-height:18px;font-size:.82rem"></div>
    <button class="btn" id="enterBtn" style="width:100%">Unlock</button>
  </div>
</div>

<main class="wrap" id="app" hidden>
  <div class="muted" id="loadNote">Loading affiliate data…</div>
  <div class="cards" id="cards" hidden></div>
  <h2 class="sec" id="affHead" hidden>Affiliates</h2>
  <div id="affWrap"></div>
  <p class="muted" style="margin-top:20px">Commissions &amp; payouts are managed in Rewardful. This panel is read-only.</p>
</main>

<script>
var TKEY="gm_admin_token";
function token(){return sessionStorage.getItem(TKEY)||"";}
function money(cents){return "$"+((Number(cents)||0)/100).toFixed(2);}
async function rw(path){
  var r=await fetch("/rwadmin/"+path,{headers:{"x-admin-token":token()}});
  if(r.status===401){throw {code:401};}
  var d=null; try{d=await r.json();}catch(e){}
  if(!r.ok) throw {code:r.status,body:d};
  return d;
}
function showGate(msg){document.getElementById("gate").style.display="flex";document.getElementById("app").hidden=true;if(msg)document.getElementById("gateErr").textContent=msg;}
function hideGate(){document.getElementById("gate").style.display="none";document.getElementById("app").hidden=false;}
document.getElementById("enterBtn").onclick=function(){
  var v=document.getElementById("pw").value.trim();
  if(!v){document.getElementById("gateErr").textContent="Enter the password.";return;}
  sessionStorage.setItem(TKEY,v); document.getElementById("pw").value=""; hideGate(); load();
};
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("enterBtn").click();});
document.getElementById("logoutBtn").onclick=function(){sessionStorage.removeItem(TKEY);showGate("");};
document.getElementById("refreshBtn").onclick=function(){load();};

function num(x){return Number(x||0);}
async function load(){
  var note=document.getElementById("loadNote"); note.textContent="Loading affiliate data…"; note.className="muted";
  try{
    var res=await rw("affiliates?limit=100");
    var list=(res&&(res.data||res.affiliates))||[];
    if(!Array.isArray(list)) list=[];
    var tv=0,tl=0,tc=0;
    list.forEach(function(a){tv+=num(a.visitors);tl+=num(a.leads);tc+=num(a.conversions);});
    var cards=[["Affiliates",list.length],["Visitors",tv],["Leads",tl],["Conversions",tc]];
    var ch=document.getElementById("cards"); ch.hidden=false;
    ch.innerHTML=cards.map(function(c){return '<div class="card"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div></div>';}).join("");
    var rows=list.map(function(a){
      var name=[a.first_name,a.last_name].filter(Boolean).join(" ")||a.name||"—";
      var st=(a.state||"").toLowerCase();
      var badge='<span class="state '+(st==="active"?"active":"other")+'">'+(a.state||"—")+'</span>';
      return "<tr><td>"+esc(name)+"</td><td class='muted'>"+esc(a.email||"—")+"</td><td>"+badge+"</td><td>"+num(a.visitors)+"</td><td>"+num(a.leads)+"</td><td>"+num(a.conversions)+"</td></tr>";
    }).join("");
    document.getElementById("affHead").hidden=false;
    document.getElementById("affWrap").innerHTML= list.length
      ? '<table><thead><tr><th>Name</th><th>Email</th><th>State</th><th>Visitors</th><th>Leads</th><th>Conversions</th></tr></thead><tbody>'+rows+'</tbody></table>'
      : '<p class="muted">No affiliates yet. Share <a class="lnk" href="/affiliates">/affiliates</a> to recruit some.</p>';
    note.textContent="";
  }catch(err){
    if(err&&err.code===401){showGate("That password didn’t work.");return;}
    note.className="err"; note.textContent="Couldn’t load Rewardful data ("+((err&&err.code)||"?")+"). It may not be deployed/configured yet.";
  }
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
if(token()){hideGate();load();}else{showGate("");}
</script>
</body></html>
