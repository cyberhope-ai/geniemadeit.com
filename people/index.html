<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My People — Friends & Family | GenieMade</title>
<meta name="description" content="Save your friends & family — their photos, birthdays and the things they love — so GenieMade can help you make and send the perfect card, right on time.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--night:#130a26;--night2:#1c1140;--panel:#231553;--panel2:#2b1b63;--line:#3a2a6b;--ink:#f7f1ff;--mut:#c6b6ea;--faint:#8f7fbb;--gold:#f5c451;--gold2:#ffe390;--goldd:#c88f2c;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(1100px 620px at 82% -6%,rgba(245,196,81,.12),transparent 60%),linear-gradient(178deg,var(--night2),var(--night));color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
.hd{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(19,10,38,.85);backdrop-filter:blur(10px);z-index:10}
.brand{font-family:var(--serif);font-size:20px;font-weight:600}.brand b{color:var(--gold)}
.hd .sp{flex:1}.hd a.back{color:var(--mut);font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:26px 22px 80px}
.eyebrow{display:inline-flex;gap:8px;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--goldd);background:rgba(245,196,81,.07);border-radius:30px;padding:5px 13px}
h1{font-family:var(--serif);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;margin:12px 0 6px}h1 em{color:var(--gold);font-style:italic}
.lead{color:var(--mut);max-width:44rem;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:30px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s}
.btn.gold{color:#2a1a05;background:linear-gradient(180deg,var(--gold2),var(--gold))}.btn.gold:hover{transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--gold)}
.quick{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 8px}
.quick button{background:var(--panel);border:1px solid var(--line);color:var(--mut);border-radius:30px;padding:9px 15px;font:inherit;font-weight:700;font-size:.88rem;cursor:pointer}
.quick button:hover{border-color:var(--gold);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:22px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.pc:hover{border-color:var(--goldd);transform:translateY(-3px)}
.pc .ph{aspect-ratio:1/1;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
.pc .ph .ini{font-family:var(--serif);font-size:2.6rem;color:var(--faint)}
.pc .b{padding:12px 14px}
.pc .nm{font-weight:700}.pc .rel{color:var(--gold2);font-size:.78rem;text-transform:capitalize}
.pc .dt{color:var(--mut);font-size:.82rem;margin-top:5px}
.addcard{border:1px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--mut);cursor:pointer;min-height:180px}
.addcard:hover{border-color:var(--gold);color:#fff}.addcard .plus{font-size:2rem;color:var(--gold2)}
.skilldna{margin-top:30px;border:1px solid var(--goldd);background:rgba(245,196,81,.06);border-radius:16px;padding:18px 20px}
.skilldna b{color:var(--gold2)}
.gate{text-align:center;padding:70px 20px}
.upwrap{margin-top:20px;border:1px solid var(--goldd);background:rgba(245,196,81,.05);border-radius:16px;padding:15px 16px}
.uphd{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);font-weight:700;margin-bottom:11px}
.uprow{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.rem{flex:0 0 auto;display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 13px}
.rph{width:46px;height:46px;border-radius:10px;overflow:hidden;background:var(--panel2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rph img{width:100%;height:100%;object-fit:cover;object-position:center top}.rph .ini2{font-family:var(--serif);color:var(--faint);font-size:1.2rem}
.ri{display:flex;flex-direction:column;gap:2px}.ri b{font-size:.9rem}.rw{color:var(--gold2);font-size:.82rem;font-weight:600}
.rbtn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a05;font-weight:800;font-size:.82rem;border-radius:20px;padding:8px 13px;white-space:nowrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,4,18,.72);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:28px 16px;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--night2);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;padding:22px}
.modal h2{font-family:var(--serif);font-size:1.4rem;font-weight:600;margin-bottom:2px}
label{display:block;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;font-weight:600}
input,select,textarea{width:100%;background:var(--night);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chipin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:6px}
.chipin input{border:none;flex:1;min-width:100px;padding:5px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:.82rem;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer;color:var(--faint)}
.phz{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.phz .t{position:relative;width:60px;height:60px}
.phz img{width:60px;height:60px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.phz .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:#2a1140;color:#ffb3c6;cursor:pointer;font-size:12px}
.phadd{width:60px;height:60px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--gold2);font-size:1.4rem;cursor:pointer}
.mbtns{display:flex;gap:10px;margin-top:20px}.mbtns .btn{flex:1;justify-content:center}
.del{background:rgba(255,80,110,.08);border:1px solid #7a2a3f;color:#ff9ab0;border-radius:30px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
.muted{color:var(--faint);font-size:.82rem;margin-top:8px}
</style></head>
<body>
<header class="hd"><a class="brand" href="/">Genie<b>Made</b></a><span class="sp"></span><a class="back" href="/app">← Studio</a></header>
<div class="wrap" id="wrap"><div class="gate">Loading…</div></div>

<div class="ov" id="ov"><div class="modal">
  <h2 id="mTitle">Add someone</h2>
  <div class="muted">Their photos, birthday and interests help us make the perfect card — and unlock a free SkillDNA trial.</div>
  <div class="row2"><div><label>Name</label><input id="fName" maxlength="60" placeholder="e.g. Cara"></div>
    <div><label>Relationship</label><select id="fRel">
      <option value="spouse">Spouse / Partner</option><option value="child">Child</option><option value="parent">Parent</option>
      <option value="sibling">Sibling</option><option value="relative">Relative</option><option value="friend" selected>Friend</option>
      <option value="coworker">Coworker</option><option value="me">Me</option><option value="other">Other</option></select></div></div>
  <label>Birthday</label><input id="fBday" type="date">
  <label>Interests (they love…)</label>
  <div class="chipin" id="fIntWrap"><span id="fIntChips"></span><input id="fInt" placeholder="type an interest, press Enter (sports, music…)"></div>
  <div class="row2"><div><label>Phone (for text reminders)</label><input id="fPhone" maxlength="24" placeholder="+1 555 123 4567"></div>
    <div><label>Email</label><input id="fEmail" maxlength="80" placeholder="optional"></div></div>
  <label>Their photos <span style="text-transform:none;color:var(--faint)">(up to 25 — for putting them in the scene)</span></label>
  <div class="phz" id="fPhz"></div>
  <input type="file" id="fFile" accept="image/*" multiple style="display:none">
  <div class="mbtns"><button class="del" id="mDel" style="display:none">Delete</button>
    <button class="btn ghost" id="mCancel">Cancel</button><button class="btn gold" id="mSave">Save</button></div>
</div></div>

<script>
(function(){
  var W=document.getElementById("wrap"), OV=document.getElementById("ov");
  var people=[], cur=null, curPhotos=[], curInterests=[];
  fetch("/api/auth/me",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){
    var u=d&&d.user; var signed=d&&d.authenticated&&u&&u.email;
    if(!signed){W.innerHTML='<div class="gate"><span class="eyebrow">My People</span><h1>Build your <em>circle</em></h1><p class="lead" style="margin:0 auto 18px">Save your friends & family so GenieMade can help you send the perfect card, right on time.</p><a class="btn gold" href="/app">Sign in to start →</a></div>';return;}
    loadPeople();
  }).catch(function(){W.innerHTML='<div class="gate">Couldn\'t load. <a href="/app" style="color:var(--gold2)">Open the Studio</a></div>';});

  function loadPeople(){
    fetch("/api/people",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){people=(d&&d.people)||[];render();});
  }
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
  function nextOccasion(p){
    var out=[]; if(p.birthday){out.push("🎂 "+fmtDate(p.birthday));}
    (p.occasions||[]).forEach(function(o){if(o.date)out.push("🎉 "+esc(o.label||"Occasion")+" "+fmtDate(o.date));});
    return out[0]||"";
  }
  function fmtDate(s){var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/)||String(s).match(/(\d{2})-(\d{2})$/);
    var mo=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    if(!m)return esc(s); if(m.length===4)return mo[+m[2]-1]+" "+(+m[3]); return mo[+m[1]-1]+" "+(+m[2]);}
  function render(){
    var cards=people.map(function(p){
      var ph=(p.photos&&p.photos[0])?'<img src="'+esc(p.photos[0])+'" alt="'+esc(p.name)+'">':'<span class="ini">'+esc((p.name||"?").slice(0,1).toUpperCase())+'</span>';
      var occ=nextOccasion(p);
      return '<div class="pc" data-id="'+p.id+'"><div class="ph">'+ph+'</div><div class="b"><div class="nm">'+esc(p.name||"Unnamed")+'</div><div class="rel">'+esc(p.relationship||"")+'</div>'+(occ?'<div class="dt">'+occ+'</div>':'')+'</div></div>';
    }).join("");
    W.innerHTML=
      '<span class="eyebrow">My People</span><h1>Your <em>circle</em></h1>'+
      '<p class="lead">Save the people you love — their photos, birthdays and what they’re into — so we can help you make and send the perfect card, right on time.</p>'+
      '<div class="quick"><button data-rel="spouse">＋ Spouse</button><button data-rel="child">＋ Child</button><button data-rel="parent">＋ Parent</button><button data-rel="relative">＋ Relative</button><button data-rel="friend">＋ Friend</button></div>'+
      '<div id="upcoming"></div>'+
      '<h2 style="font-family:var(--serif);font-size:1.2rem;font-weight:600;margin:26px 0 2px">Everyone</h2>'+
      '<div class="grid">'+cards+'<div class="addcard" id="addBtn"><span class="plus">＋</span>Add someone</div></div>'+
      '<div class="skilldna">✨ <b>Coming soon:</b> the interests you save here unlock a <b>free SkillDNA trial</b> — a science-backed read on what makes each person tick, so every card lands.</div>';
    [].forEach.call(document.querySelectorAll(".pc"),function(c){c.onclick=function(){edit(people.find(function(x){return x.id===c.dataset.id;}));};});
    document.getElementById("addBtn").onclick=function(){edit(null,"friend");};
    [].forEach.call(document.querySelectorAll(".quick button"),function(b){b.onclick=function(){edit(null,b.dataset.rel);};});
    loadReminders();
  }
  function loadReminders(){
    var box=document.getElementById("upcoming"); if(!box)return;
    fetch("/api/reminders?days=60",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(d){
      var rem=(d&&d.reminders)||[]; if(!rem.length){box.innerHTML="";return;}
      var cards=rem.slice(0,8).map(function(r){
        var ph=r.photo?'<img src="'+esc(r.photo)+'" alt="">':'<span class="ini2">'+esc((r.name||"?").slice(0,1).toUpperCase())+'</span>';
        var when=r.days_away===0?"today!":r.days_away===1?"tomorrow":("in "+r.days_away+" days");
        var icon=r.kind==="birthday"?"🎂":"🎉";
        var pk=r.kind==="birthday"?"birthday":"congrats";
        var href='/app?pack='+pk+(r.photo?'&ref='+encodeURIComponent(r.photo):'');
        return '<div class="rem"><div class="rph">'+ph+'</div><div class="ri"><b>'+icon+' '+esc(r.name||"Someone")+"'s "+esc(r.label)+'</b><span class="rw">'+when+'</span></div><a class="rbtn" href="'+href+'">Make their card →</a></div>';
      }).join("");
      box.innerHTML='<div class="upwrap"><div class="uphd">⏰ Coming up</div><div class="uprow">'+cards+'</div></div>';
    }).catch(function(){});
  }
  // ---- editor ----
  function edit(p,rel){
    cur=p||null; curPhotos=p?(p.photos||[]).slice():[]; curInterests=p?(p.interests||[]).slice():[];
    document.getElementById("mTitle").textContent=p?("Edit "+(p.name||"person")):"Add someone";
    document.getElementById("fName").value=p?p.name||"":"";
    document.getElementById("fRel").value=p?p.relationship||"friend":(rel||"friend");
    document.getElementById("fBday").value=(p&&/^\d{4}-\d{2}-\d{2}$/.test(p.birthday||""))?p.birthday:"";
    document.getElementById("fPhone").value=p?p.phone||"":"";
    document.getElementById("fEmail").value=p?p.email||"":"";
    document.getElementById("mDel").style.display=p?"":"none";
    renderChips(); renderPhz(); OV.classList.add("on");
  }
  function renderChips(){
    document.getElementById("fIntChips").innerHTML=curInterests.map(function(t,i){return '<span class="chip">'+esc(t)+'<b data-i="'+i+'">✕</b></span>';}).join("");
    [].forEach.call(document.querySelectorAll("#fIntChips b"),function(x){x.onclick=function(){curInterests.splice(+x.dataset.i,1);renderChips();};});
  }
  document.getElementById("fInt").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===","){e.preventDefault();var v=this.value.trim().replace(/,$/,"");if(v){curInterests.push(v);this.value="";renderChips();}}});
  function renderPhz(){
    var h=curPhotos.map(function(u,i){return '<div class="t"><img src="'+esc(u)+'"><button class="x" data-i="'+i+'">✕</button></div>';}).join("");
    document.getElementById("fPhz").innerHTML=h+'<button class="phadd" id="phAdd">＋</button>';
    [].forEach.call(document.querySelectorAll("#fPhz .x"),function(x){x.onclick=function(){curPhotos.splice(+x.dataset.i,1);renderPhz();};});
    document.getElementById("phAdd").onclick=function(){document.getElementById("fFile").click();};
  }
  document.getElementById("fFile").addEventListener("change",function(){
    var files=[].slice.call(this.files||[]); this.value="";
    files.slice(0,25-curPhotos.length).forEach(function(f){
      if(!/^image\//.test(f.type))return; var fd=new FormData();fd.append("file",f);
      var add=document.getElementById("phAdd"); if(add)add.textContent="…";
      fetch("/api/upload",{method:"POST",body:fd,credentials:"same-origin"}).then(function(r){return r.json()}).then(function(j){if(j&&j.url){curPhotos.push(j.url);renderPhz();}});
    });
  });
  document.getElementById("mCancel").onclick=function(){OV.classList.remove("on");};
  OV.addEventListener("click",function(e){if(e.target===OV)OV.classList.remove("on");});
  document.getElementById("mSave").onclick=function(){
    var body={id:cur?cur.id:undefined,name:document.getElementById("fName").value.trim(),relationship:document.getElementById("fRel").value,
      birthday:document.getElementById("fBday").value,phone:document.getElementById("fPhone").value.trim(),email:document.getElementById("fEmail").value.trim(),
      interests:curInterests,photos:curPhotos};
    if(!body.name&&!body.photos.length){alert("Add a name.");return;}
    var b=this;b.textContent="Saving…";b.disabled=true;
    fetch("/api/people",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(d){
      b.textContent="Save";b.disabled=false;
      if(!d.ok){alert(d.message||"Could not save.");return;}
      people=d.people;OV.classList.remove("on");render();
    }).catch(function(){b.textContent="Save";b.disabled=false;alert("Network error.");});
  };
  document.getElementById("mDel").onclick=function(){
    if(!cur||!confirm("Remove "+(cur.name||"this person")+"?"))return;
    fetch("/api/people/delete",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({id:cur.id})}).then(function(r){return r.json()}).then(function(d){people=(d&&d.people)||people;OV.classList.remove("on");render();});
  };
})();
</script>
</body></html>
