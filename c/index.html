<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A card for you | GenieMade</title>
<meta name="description" content="Someone made you a personalized card with GenieMade. Open it — then make your own, free.">
<meta property="og:title" content="You've got a card 🎴"><meta property="og:description" content="Someone made you a personalized GenieMade card. Open it — then make your own.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--night:#130a26;--night2:#1c1140;--line:#3a2a6b;--ink:#f7f1ff;--mut:#c6b6ea;--faint:#8f7fbb;--gold:#f5c451;--gold2:#ffe390;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(1100px 640px at 50% -8%,rgba(245,196,81,.16),transparent 60%),linear-gradient(178deg,var(--night2),var(--night));color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;text-align:center}
a{color:inherit;text-decoration:none}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;padding:16px;display:inline-block}.brand b{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:8px 22px 60px}
.eyebrow{display:inline-flex;gap:8px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);border:1px solid var(--gold);background:rgba(245,196,81,.08);border-radius:30px;padding:6px 15px;margin-top:8px}
h1{font-family:var(--serif);font-size:clamp(1.7rem,5vw,2.4rem);font-weight:600;margin:16px 0 6px}h1 em{color:var(--gold);font-style:italic}
.card{margin:22px auto 0;max-width:400px}
.card img{width:100%;border-radius:16px;box-shadow:0 26px 70px -18px rgba(0,0,0,.75);display:block}
.msg{color:var(--mut);font-size:1.05rem;margin:20px auto;max-width:36rem;font-style:italic}
.cta{margin-top:26px}
.btn{display:inline-block;border:none;border-radius:30px;padding:15px 30px;font:inherit;font-weight:800;cursor:pointer;color:#2a1a05;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 12px 30px -8px rgba(245,196,81,.6)}
.btn:hover{transform:translateY(-2px)}
.sub{color:var(--faint);font-size:.9rem;margin-top:14px}
.cert{display:inline-flex;gap:7px;color:var(--gold2);font-size:.8rem;margin-top:16px}
.err{color:var(--mut);margin-top:40px}
.spin{margin:60px auto;width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body>
<a class="brand" href="/">Genie<b>Made</b></a>
<div class="wrap" id="wrap"><div class="spin"></div></div>
<script>
(function(){
  var id=new URLSearchParams(location.search).get("id")||"";
  var w=document.getElementById("wrap");
  if(!id){w.innerHTML='<p class="err">This card link looks incomplete.</p><div class="cta"><a class="btn" href="/app">Make your own card →</a></div>';return;}
  fetch("/api/card/"+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(d){
    if(!d.ok||!d.card){w.innerHTML='<p class="err">Sorry, this card isn\'t available.</p><div class="cta"><a class="btn" href="/app">Make your own card →</a></div>';return;}
    var c=d.card, isInv=c.kind==="invite";
    var from=c.from?(" from "+c.from):"";
    w.innerHTML=
      '<span class="eyebrow">'+(isInv?"✉️ You\'re invited":"🎴 A card for you")+'</span>'+
      '<h1>'+(isInv?"You\'re <em>invited</em>":(c.to?("For <em>"+esc(c.to)+"</em>"):"A card <em>just for you</em>"))+'</h1>'+
      (from?'<div class="sub">'+esc("Sent"+from)+'</div>':'')+
      '<div class="card"><img src="'+esc(c.image)+'" alt="Your GenieMade '+(isInv?"invite":"card")+'"></div>'+
      (c.message?'<p class="msg">“'+esc(c.message)+'”</p>':'')+
      '<div class="cert">◈ Certified &amp; provably made on GenieMade</div>'+
      '<div class="cta"><a class="btn" href="/app">Make your own — 3 free →</a><div class="sub">Put yourself in the scene · certified · yours forever</div></div>';
  }).catch(function(){w.innerHTML='<p class="err">Couldn\'t load this card. Try again.</p>';});
  function esc(s){return String(s||"").replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];});}
})();
</script>
</body></html>
